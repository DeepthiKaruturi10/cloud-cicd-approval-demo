name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Manually Approved Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Confirm manual release
        run: echo "Manual release triggered successfully."

      - name: Show release information
        run: |
          echo "Project: cloud-cicd-approval-demo"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
